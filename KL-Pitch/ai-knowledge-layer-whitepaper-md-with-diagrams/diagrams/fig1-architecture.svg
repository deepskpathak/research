<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .layer-title { font-size: 15px; font-weight: bold; fill: #1a2733; }
    .layer-sub { font-size: 11px; fill: #5d6d7e; }
    .box { fill: #ffffff; stroke: #aab7b8; stroke-width: 1; rx: 4; }
    .box-text { font-size: 11.5px; fill: #2c3e50; }
    .arrow { stroke: #1a5276; stroke-width: 2; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a5276"/>
    </marker>
  </defs>

  <!-- Layer 1: Agentic Consumers -->
  <rect x="20" y="16" width="920" height="96" fill="#eaf2f8" stroke="#1a5276" stroke-width="1.5" rx="6"/>
  <text x="36" y="40" class="layer-title">1 · Agentic Consumers</text>
  <text x="36" y="56" class="layer-sub">Any MCP-capable agent; no privileged tool</text>
  <rect x="36" y="66" width="160" height="34" class="box"/><text x="116" y="87" class="box-text" text-anchor="middle">Claude Code</text>
  <rect x="210" y="66" width="160" height="34" class="box"/><text x="290" y="87" class="box-text" text-anchor="middle">Copilot / IDE agents</text>
  <rect x="384" y="66" width="170" height="34" class="box"/><text x="469" y="87" class="box-text" text-anchor="middle">GS AI Assistant</text>
  <rect x="568" y="66" width="170" height="34" class="box"/><text x="653" y="87" class="box-text" text-anchor="middle">CI/CD &amp; review bots</text>
  <rect x="752" y="66" width="170" height="34" class="box"/><text x="837" y="87" class="box-text" text-anchor="middle">Desk-built agents</text>

  <line x1="480" y1="112" x2="480" y2="140" class="arrow"/>

  <!-- Layer 2: Serving / Gateway -->
  <rect x="20" y="142" width="920" height="110" fill="#fdf2e9" stroke="#ca6f1e" stroke-width="1.5" rx="6"/>
  <text x="36" y="166" class="layer-title">2 · Serving: the Knowledge Gateway</text>
  <text x="36" y="182" class="layer-sub">One core; thin protocol adapters (MCP primary, REST/GraphQL secondary)</text>
  <rect x="36" y="192" width="180" height="46" class="box"/><text x="126" y="211" class="box-text" text-anchor="middle">MCP server fleet</text><text x="126" y="226" class="box-text" text-anchor="middle" font-size="10">named, scoped tools</text>
  <rect x="230" y="192" width="180" height="46" class="box"/><text x="320" y="211" class="box-text" text-anchor="middle">Entitlement-aware</text><text x="320" y="226" class="box-text" text-anchor="middle">router (default-deny)</text>
  <rect x="424" y="192" width="180" height="46" class="box"/><text x="514" y="211" class="box-text" text-anchor="middle">Semantic catalog</text><text x="514" y="226" class="box-text" text-anchor="middle" font-size="10">intent → source</text>
  <rect x="618" y="192" width="150" height="46" class="box"/><text x="693" y="211" class="box-text" text-anchor="middle">Audit &amp;</text><text x="693" y="226" class="box-text" text-anchor="middle">provenance log</text>
  <rect x="782" y="192" width="140" height="46" class="box"/><text x="852" y="211" class="box-text" text-anchor="middle">Telemetry &amp;</text><text x="852" y="226" class="box-text" text-anchor="middle">gap routing</text>

  <line x1="480" y1="252" x2="480" y2="280" class="arrow"/>

  <!-- Layer 3: Knowledge Representation -->
  <rect x="20" y="282" width="920" height="92" fill="#f4f6f7" stroke="#5d6d7e" stroke-width="1.5" rx="6"/>
  <text x="36" y="306" class="layer-title">3 · Knowledge Representation</text>
  <text x="36" y="322" class="layer-sub">Task-shaped, cited, classified; never the system of record</text>
  <rect x="36" y="330" width="200" height="34" class="box"/><text x="136" y="351" class="box-text" text-anchor="middle">Vector store</text>
  <rect x="252" y="330" width="200" height="34" class="box"/><text x="352" y="351" class="box-text" text-anchor="middle">Knowledge graph</text>
  <rect x="468" y="330" width="220" height="34" class="box"/><text x="578" y="351" class="box-text" text-anchor="middle">Docs-as-code skill registry</text>
  <rect x="704" y="330" width="218" height="34" class="box"/><text x="813" y="351" class="box-text" text-anchor="middle">Metadata catalog</text>

  <line x1="480" y1="374" x2="480" y2="402" class="arrow"/>

  <!-- Layer 4: Ingestion / Context Factories -->
  <rect x="20" y="404" width="920" height="92" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5" rx="6"/>
  <text x="36" y="428" class="layer-title">4 · Ingestion: Context Factories</text>
  <text x="36" y="444" class="layer-sub">Owner-run pipelines, triggered on every source change</text>
  <rect x="36" y="452" width="160" height="34" class="box"/><text x="116" y="473" class="box-text" text-anchor="middle">Connectors</text>
  <rect x="212" y="452" width="180" height="34" class="box"/><text x="302" y="473" class="box-text" text-anchor="middle">Classification / DLP</text>
  <rect x="408" y="452" width="180" height="34" class="box"/><text x="498" y="473" class="box-text" text-anchor="middle">Entity extraction</text>
  <rect x="604" y="452" width="150" height="34" class="box"/><text x="679" y="473" class="box-text" text-anchor="middle">Certification</text>
  <rect x="770" y="452" width="152" height="34" class="box"/><text x="846" y="473" class="box-text" text-anchor="middle">Freshness tagging</text>

  <line x1="480" y1="496" x2="480" y2="524" class="arrow"/>

  <!-- Layer 5: Sources of Truth -->
  <rect x="20" y="526" width="920" height="96" fill="#fef9e7" stroke="#b7950b" stroke-width="1.5" rx="6"/>
  <text x="36" y="550" class="layer-title">5 · Sources of Truth</text>
  <text x="36" y="566" class="layer-sub">Unchanged, owned by domains; no migration, no new system of record</text>
  <rect x="36" y="576" width="196" height="34" class="box"/><text x="134" y="592" class="box-text" text-anchor="middle">Code repos + AGENTS.md /</text><text x="134" y="605" class="box-text" text-anchor="middle">CLAUDE.md / SKILL.md</text>
  <rect x="246" y="576" width="150" height="34" class="box"/><text x="321" y="597" class="box-text" text-anchor="middle">Confluence &amp; Jira</text>
  <rect x="410" y="576" width="160" height="34" class="box"/><text x="490" y="597" class="box-text" text-anchor="middle">Service catalog / CMDB</text>
  <rect x="584" y="576" width="120" height="34" class="box"/><text x="644" y="597" class="box-text" text-anchor="middle">ADRs, runbooks</text>
  <rect x="718" y="576" width="204" height="34" class="box"/><text x="820" y="597" class="box-text" text-anchor="middle">Data, policy &amp; agent artifacts</text>
</svg>
